<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataFusion Plan Visualizer</title>
  <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.31.0/dist/cytoscape.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: ui-monospace, "Cascadia Code", "Fira Code", monospace;
      background: #0f1117;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ──────────────────────────────── */
    header {
      padding: 14px 20px;
      border-bottom: 1px solid #1e2535;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #94a3b8;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .badge {
      font-size: 11px;
      background: #1e293b;
      color: #64748b;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid #334155;
    }

    /* ── Workspace (sidebar + main) ──────────── */
    .workspace {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ─────────────────────────────── */
    .sidebar {
      width: 260px;
      min-width: 260px;
      border-right: 1px solid #1e2535;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 10px 16px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #64748b;
      border-bottom: 1px solid #1e2535;
      flex-shrink: 0;
    }

    #tables-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    #tables-list::-webkit-scrollbar { width: 4px; }
    #tables-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

    .table-item { border-bottom: 1px solid #1e253580; }

    .table-name {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 14px;
      font-size: 12px;
      color: #94a3b8;
      cursor: pointer;
      user-select: none;
    }

    .table-name:hover { background: #1e2535; color: #e2e8f0; }
    .table-name:hover .table-remove { opacity: 1; }

    .table-chevron {
      font-size: 9px;
      color: #475569;
      transition: transform 0.15s;
      flex-shrink: 0;
    }

    .table-chevron.open { transform: rotate(90deg); }

    .table-remove {
      margin-left: auto;
      background: none;
      border: none;
      color: #475569;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      padding: 0 2px;
      opacity: 0;
      transition: opacity 0.1s, color 0.1s;
      flex-shrink: 0;
    }

    .table-remove:hover { color: #f87171; }

    .table-columns {
      display: none;
      padding: 2px 0 6px 0;
    }

    .column-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 3px 14px 3px 30px;
      font-size: 11px;
    }

    .col-name { color: #94a3b8; }
    .col-type { color: #475569; font-size: 10px; }

    /* ── Drop zone ───────────────────────────── */
    #drop-zone {
      margin: 12px;
      border: 1.5px dashed #334155;
      border-radius: 6px;
      padding: 14px 10px;
      text-align: center;
      color: #475569;
      font-size: 11px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      flex-shrink: 0;
      line-height: 1.6;
      min-height: 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      user-select: none;
      pointer-events: auto;
    }

    #drop-zone * { pointer-events: none; }

    #drop-zone:hover { border-color: #4f6ef7; color: #94a3b8; background: #1e253580; }
    #drop-zone:active { background: #1e2535b0; transform: translateY(1px); }
    #drop-zone.drag-over { border-color: #4f6ef7; color: #a5b4fc; background: #1e253580; }
    #drop-zone.loading { border-color: #334155; color: #475569; cursor: default; }

    /* ── Mode selector ───────────────────────── */
    .mode-selector {
      display: flex;
      gap: 2px;
      background: #1e2535;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 2px;
    }

    .mode-btn {
      background: none;
      border: none;
      border-radius: 4px;
      color: #64748b;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      padding: 5px 10px;
      white-space: nowrap;
    }

    .mode-btn:hover { color: #94a3b8; background: #0f111780; }
    .mode-btn.active { background: #334155; color: #e2e8f0; }

    /* ── Main panel ──────────────────────────── */
    .main-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .controls {
      padding: 12px 20px;
      border-bottom: 1px solid #1e2535;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    /* ── SQL textarea ────────────────────────── */
    #sql-input {
      flex: 1;
      min-width: 0;
      height: 120px;
      background: #0f1117;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #e2e8f0;
      font-family: ui-monospace, "Cascadia Code", "Fira Code", monospace;
      font-size: 13px;
      padding: 12px;
      resize: vertical;
      line-height: 1.5;
    }

    #sql-input:focus {
      outline: none;
      border-color: #4f6ef7;
      box-shadow: 0 0 0 1px #4f6ef7;
    }

    .right-controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-end;
    }

    label.toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #64748b;
      cursor: pointer;
      user-select: none;
    }

    label.toggle input[type=checkbox] { accent-color: #4f6ef7; }

    button {
      background: #4f6ef7;
      border: none;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 20px;
      white-space: nowrap;
    }

    button:hover { background: #3b5bdb; }
    button:disabled { background: #334155; color: #64748b; cursor: default; }

    #error {
      display: none;
      padding: 8px 20px;
      background: #2d1a1a;
      color: #f87171;
      font-size: 12px;
      border-bottom: 1px solid #7f1d1d;
      flex-shrink: 0;
    }

    /* ── Graph area ──────────────────────────── */
    .graph-wrapper {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #cy {
      flex: 1;
      background: #0f1117;
    }

    #cy.hidden { display: none; }

    /* ── Diff view ───────────────────────────── */
    #cy-diff-wrapper {
      display: none;
      flex: 1;
    }

    #cy-diff-wrapper.visible { display: flex; }

    .diff-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .diff-label {
      padding: 4px 12px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #475569;
      border-bottom: 1px solid #1e2535;
      flex-shrink: 0;
    }

    #cy-left, #cy-right { flex: 1; background: #0f1117; }

    .diff-divider { width: 1px; background: #1e2535; flex-shrink: 0; }

    #legend {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: #1e2535cc;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 11px;
      backdrop-filter: blur(4px);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #94a3b8;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    #tooltip {
      position: absolute;
      display: none;
      background: #1e2535;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      color: #e2e8f0;
      max-width: 360px;
      word-break: break-word;
      pointer-events: none;
      z-index: 10;
    }

    /* ── Detail panel ────────────────────────── */
    #detail-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #13192680;
      backdrop-filter: blur(8px);
      border-top: 1px solid #334155;
      padding: 12px 16px;
      transform: translateY(100%);
      transition: transform 0.2s ease;
      z-index: 20;
    }

    #detail-panel.visible { transform: translateY(0); }

    .detail-header {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 10px;
    }

    .detail-type-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      color: #fff;
      flex-shrink: 0;
    }

    .detail-label {
      font-size: 12px;
      color: #94a3b8;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .detail-close {
      background: none;
      border: none;
      color: #475569;
      cursor: pointer;
      font-size: 14px;
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
    }

    .detail-close:hover { color: #94a3b8; }

    .detail-schema {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .schema-chip {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #0f1117;
      border: 1px solid #1e2535;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
    }

    .chip-name { color: #94a3b8; }
    .chip-type { color: #475569; }
    .chip-null {
      font-size: 9px;
      color: #334155;
      border: 1px solid #1e2535;
      border-radius: 2px;
      padding: 0 3px;
    }

    .detail-empty {
      font-size: 11px;
      color: #334155;
      font-style: italic;
    }

    /* ── Query history ───────────────────────── */
    .history-wrapper {
      position: relative;
    }

    #history-btn {
      background: #1e2535;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #64748b;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      font-weight: 500;
      padding: 5px 10px;
      white-space: nowrap;
    }

    #history-btn:hover { background: #283348; color: #94a3b8; }

    #history-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      width: 340px;
      background: #1e2535;
      border: 1px solid #334155;
      border-radius: 8px;
      box-shadow: 0 8px 24px #00000060;
      z-index: 100;
      overflow: hidden;
    }

    #history-dropdown.open { display: flex; flex-direction: column; }

    #history-list {
      max-height: 260px;
      overflow-y: auto;
    }

    #history-list::-webkit-scrollbar { width: 4px; }
    #history-list::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }

    .history-empty {
      padding: 16px;
      font-size: 11px;
      color: #475569;
      text-align: center;
      font-style: italic;
    }

    .history-item {
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 1px solid #1e253580;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .history-item:last-child { border-bottom: none; }
    .history-item:hover { background: #283348; }

    .history-sql {
      font-size: 11px;
      color: #94a3b8;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-meta {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .history-mode {
      font-size: 9px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 1px 5px;
      border-radius: 3px;
      background: #334155;
      color: #64748b;
    }

    .history-time {
      font-size: 10px;
      color: #475569;
    }

    .history-footer {
      padding: 6px 12px;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: flex-end;
    }

    #history-clear-btn {
      background: none;
      border: none;
      color: #475569;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      padding: 2px 4px;
    }

    #history-clear-btn:hover { color: #f87171; }
  </style>
</head>
<body>

<header>
  <h1>Plan Visualizer</h1>
  <span class="badge">DataFusion</span>
</header>

<div class="workspace">

  <!-- ── Sidebar ── -->
  <aside class="sidebar">
    <div class="sidebar-header">Tables</div>
    <div id="tables-list"></div>
    <label id="drop-zone">
      Drop CSV, JSON, or Avro to register table<br>
      <span style="color:#334155">or click to browse</span>
      <input type="file" id="file-input" accept=".csv,.json,.avro" style="opacity:0;position:absolute;z-index:-1;width:0;height:0;" />
    </label>
  </aside>

  <!-- ── Main panel ── -->
  <div class="main-panel">
    <div class="controls">
      <textarea id="sql-input" spellcheck="false" placeholder="Enter SQL query..."></textarea>
      <div class="right-controls">
        <div class="mode-selector">
          <button class="mode-btn active" data-mode="logical">Logical</button>
          <button class="mode-btn" data-mode="optimized">Optimized</button>
          <button class="mode-btn" data-mode="physical">Physical</button>
          <button class="mode-btn" data-mode="diff">Diff</button>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          <div class="history-wrapper">
            <button id="history-btn">History ▾</button>
            <div id="history-dropdown">
              <div id="history-list"></div>
              <div class="history-footer">
                <button id="history-clear-btn">Clear history</button>
              </div>
            </div>
          </div>
          <button id="run-btn">Run</button>
        </div>
      </div>
    </div>

    <div id="error"></div>

    <div class="graph-wrapper">
      <div id="cy"></div>

      <div id="cy-diff-wrapper">
        <div class="diff-panel">
          <div class="diff-label">Unoptimized</div>
          <div id="cy-left"></div>
        </div>
        <div class="diff-divider"></div>
        <div class="diff-panel">
          <div class="diff-label">Optimized</div>
          <div id="cy-right"></div>
        </div>
      </div>

      <div id="legend">
        <div class="legend-item"><div class="legend-dot" style="background:#22c55e"></div>Scan</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f97316"></div>Filter</div>
        <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div>Projection</div>
        <div class="legend-item"><div class="legend-dot" style="background:#a855f7"></div>Aggregate</div>
        <div class="legend-item"><div class="legend-dot" style="background:#06b6d4"></div>Sort</div>
        <div class="legend-item"><div class="legend-dot" style="background:#f43f5e"></div>Limit</div>
        <div class="legend-item"><div class="legend-dot" style="background:#eab308"></div>Join</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ec4899"></div>Repartition</div>
        <div class="legend-item"><div class="legend-dot" style="background:#64748b"></div>Other</div>
        <div id="diff-legend" style="display:none;flex-direction:column;gap:5px;">
          <div style="height:1px;background:#334155;margin:2px 0"></div>
          <div class="legend-item"><div class="legend-dot" style="background:none;border:2px solid #22c55e;box-sizing:border-box"></div>Added</div>
          <div class="legend-item"><div class="legend-dot" style="background:none;border:2px solid #f43f5e;opacity:0.6;box-sizing:border-box"></div>Removed</div>
          <div class="legend-item"><div class="legend-dot" style="background:none;border:2px solid #eab308;box-sizing:border-box"></div>Modified</div>
        </div>
      </div>
      <div id="tooltip"></div>

      <div id="detail-panel">
        <div class="detail-header">
          <span id="detail-type" class="detail-type-badge"></span>
          <span id="detail-label" class="detail-label"></span>
          <button class="detail-close" id="detail-close-btn">✕</button>
        </div>
        <div id="detail-schema" class="detail-schema"></div>
      </div>
    </div>
  </div>

</div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
