[project]
name = "exec-plan"
version = "0.1.0"
description = "DataFusion Execution Plan Visualizer"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "datafusion>=52.0.0",
    "fastapi>=0.115.0",
    "pandas>=3.0.1",
    "python-multipart>=0.0.22",
    "ruff>=0.15.6",
    "ty>=0.0.23",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[too.fastapi]
entrypoint = "server.app:app"